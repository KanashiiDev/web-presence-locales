name: Process translation submissions

# Submissions are immutable JSON files added by a PR (or direct push for
# maintainers). This workflow consumes them on main and auto-merges safe
# key-level patches. Serialized concurrency + compare-and-swap commits keep
# concurrent contributions from overwriting each other.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'submissions/**'

permissions:
  contents: write

concurrency:
  group: locale-submission-processing
  cancel-in-progress: false

jobs:
  process:
    name: Validate and apply submissions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Process submissions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_REPO: KanashiiDev/web-presence
        run: node tools/bin/process-submissions.js

      # Commits made with github.token do NOT trigger other workflows. Without
      # this inline step the auto-merged translations would never reach the
      # runtime manifest. `if: always()` keeps earlier successful commits
      # visible even when a later submission fails the job.
      - name: Refresh manifest
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            SNAPSHOT_SHA="$(git rev-parse HEAD)"
            export SNAPSHOT_SHA
            node tools/bin/manifest.js --write
            if git diff --quiet -- runtime/manifest.json; then
              echo "Manifest unchanged"
              exit 0
            fi
            git add runtime/manifest.json
            git commit -m "chore: refresh runtime translation manifest [skip ci]"
            if git push origin "HEAD:$BRANCH"; then
              echo "Manifest published from $(git rev-parse HEAD)"
              exit 0
            fi
            echo "Push failed; regenerating on latest head (attempt $attempt)"
          done
          echo "Could not publish manifest after 5 attempts" >&2
          exit 1
