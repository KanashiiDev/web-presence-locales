name: Merge validated submissions

# Submission PRs are opened by the translation editor. This workflow runs in the
# base-repo context via `workflow_run` so the token is never exposed to the PR's
# (untrusted) code. When validation passes the workflow merges the PR directly;
# it does not rely on GitHub's auto-merge queue or any PAT. The head commit is
# pinned so a newer push cannot be merged by a stale run.

on:
  workflow_run:
    workflows: ["Validate locale data"]
    types: [completed]

permissions:
  actions: write
  contents: write
  checks: read
  pull-requests: write

concurrency:
  group: merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge when all checks pass
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The run executes in the base-repo context. Check out trusted tooling
      # from main so the check-run gate cannot be altered by the PR.
      - name: Checkout trusted tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: trusted
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: trusted/.nvmrc
      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          event=$(cat "$GITHUB_EVENT_PATH")
          sha=$(jq -r '.workflow_run.head_sha' <<<"$event")
          pr=$(jq -r '.workflow_run.pull_requests[0].number // empty' <<<"$event")

          # Fork PRs are not always attached to the workflow_run payload.
          if [ -z "$pr" ]; then
            pr=$(gh api "/repos/$REPO/commits/$sha/pulls" --jq '.[0].number // empty')
          fi
          if [ -z "$pr" ]; then
            echo "No pull request found for $sha - skipping."
            exit 0
          fi

          details=$(gh api "/repos/$REPO/pulls/$pr")
          state=$(jq -r '.state' <<<"$details")
          draft=$(jq -r '.draft' <<<"$details")
          head_sha=$(jq -r '.head.sha' <<<"$details")

          skip() {
            echo "$1 Skipping merge for PR #$pr."
            exit 0
          }

          [ "$state" = "open" ] || skip "PR is $state."
          [ "$draft" = "false" ] || skip "PR is a draft."
          # The run may have finished after a newer commit was pushed.
          [ "$head_sha" = "$sha" ] || skip "Head moved from $sha to $head_sha."

          # Mirror the path guard in validate.yml: only submission-only PRs are
          # eligible for automatic merging.
          files=$(gh api --paginate "/repos/$REPO/pulls/$pr/files?per_page=100" | jq -r '.[].filename')
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if ! printf '%s' "$file" | grep -Eq '^submissions/[a-z]{2,3}(-[a-z0-9]+)*/[A-Za-z0-9_-]+\.json$'; then
              skip "PR changes a non-submission file: $file"
            fi
          done <<<"$files"

          # Judge the latest run per (app.id, name). GitHub's filter=latest only
          # removes superseded attempts inside one check suite; an older failed
          # suite on the same SHA would otherwise block this merge forever.
          if ! gh api --paginate "/repos/$REPO/commits/$sha/check-runs?per_page=100" \
            | node trusted/tools/bin/check-runs.js; then
            skip "Check runs are not green for $sha."
          fi

          # Legacy commit statuses, when present.
          read -r combined count <<<"$(gh api "/repos/$REPO/commits/$sha/status" \
            --jq '.state + " " + (.statuses | length | tostring)')"
          if [ "$count" -gt 0 ] && [ "$combined" != "success" ]; then
            skip "Combined commit status is $combined."
          fi

          response=$(mktemp)
          if ! gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$sha" >"$response" 2>&1; then
            echo "::error::Could not merge PR #$pr. API said: $(cat "$response")"
            echo "Check contents: write and pull-requests: write permissions."
            exit 1
          fi
          echo "Merged PR #$pr at $sha."

          # A merge performed with GITHUB_TOKEN does not emit a push event that
          # starts other workflows, so dispatch the submission processor here.
          # workflow_dispatch is one of the events GITHUB_TOKEN can trigger.
          dispatch=$(mktemp)
          if ! gh workflow run process-submission.yml --repo "$REPO" --ref main -f pr_number="$pr" >"$dispatch" 2>&1; then
            echo "::error::Could not dispatch process-submission.yml. API said: $(cat "$dispatch")"
            echo "Check actions: write permission."
            exit 1
          fi
          echo "Dispatched process-submission.yml."
